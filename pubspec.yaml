name: workshop
description: "A Flutter app that classifies waste photos into Bali's three-bin taxonomy (organik, non-organik, residu) using Gemini 2.5 Flash."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^6.0.1
  flutter_riverpod: ^3.5.0
  image_picker: ^1.2.1
  google_fonts: ^8.0.2
  google_generative_ai: ^0.4.7
  riverpod_annotation: ^4.0.8
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.10
  build_runner: ^2.14.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#0A1F00"
    theme_color: "#0A1F00"
  windows:
    generate: true
    image_path: "assets/icon/icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icon/
